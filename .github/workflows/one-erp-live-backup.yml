      - name: Request Odoo backup
        env:
          ODOO_MASTER_PASSWORD: ${{ secrets.ODOO_MASTER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --form-string "master_pwd=${ODOO_MASTER_PASSWORD}" \
            --form-string 'name=one_erp_db' \
            --form-string 'backup_format=zip' \
            'https://one-erp-live.onrender.com/web/database/backup' \
            --output one-erp-live-backup.zip
          test -s one-erp-live-backup.zip
          unzip -t one-erp-live-backup.zip

      - name: Encrypt backup before upload
        shell: bash
        run: |
          set -euo pipefail
          openssl cms -encrypt -binary -aes256 \
            -in one-erp-live-backup.zip \
            -outform DER \
            -out one-erp-live-backup.p7m \
            backup-cert.pem
          shred -u one-erp-live-backup.zip
          test -s one-erp-live-backup.p7m

      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@v4
        with:
          name: one-erp-live-encrypted-backup
          path: one-erp-live-backup.p7m
          retention-days: 1
          if-no-files-found: error
