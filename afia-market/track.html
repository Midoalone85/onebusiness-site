<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع طلبك | بقالة عافية</title><style>
:root{--g:#0f7a4a;--bg:#f5f8f6;--line:#dce7e0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,Arial;background:linear-gradient(180deg,#f7fbf8,#fff);color:#173126}.wrap{max-width:720px;margin:auto;padding:20px}header{background:#0f7a4a;color:#fff;padding:16px}.head{max-width:720px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.head a{color:#fff;font-weight:900}.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 14px 45px #17312613;margin-top:22px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.form input,.form button{font:inherit;border-radius:12px;padding:12px}.form input{border:1px solid var(--line)}.form button{border:0;background:var(--g);color:#fff;font-weight:900}.result{margin-top:18px}.orderNo{font-size:25px;font-weight:950;color:var(--g)}.timeline{display:grid;gap:10px;margin-top:18px}.step{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}.dot{width:16px;height:16px;border-radius:50%;background:#cbd8d0;margin-top:3px}.step.done .dot{background:var(--g);box-shadow:0 0 0 5px #0f7a4a18}.step b{display:block}.step small{color:#738077}.summary{margin-top:16px;padding:14px;background:#f6faf7;border-radius:16px}.items{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}.status{display:inline-block;background:#e9f8ef;color:var(--g);padding:7px 10px;border-radius:999px;font-weight:900}.auto{margin-top:8px;font-size:12px;color:#6b7d73}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#0f7a4a;box-shadow:0 0 0 0 #0f7a4a55;animation:pulse 1.8s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px #0f7a4a00}}@media(max-width:650px){.form{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><header><div class="head"><div><b>بقالة عافية</b><div style="font-size:12px;opacity:.85">تتبع طلبك</div></div><a href="./">← المتجر</a></div></header><main class="wrap"><section class="card"><h1 style="margin-top:0">📦 أين وصل طلبك؟</h1><p>اكتب رقم الطلب ورقم الجوال المستخدم عند الطلب.</p><div class="form"><input id="orderId" placeholder="رقم الطلب مثل AF261004-1234"><input id="phone" placeholder="رقم الجوال"><button id="trackBtn">تتبع</button></div><div id="msg" style="margin-top:10px;color:#b42318"></div><div id="autoState" class="auto"></div><div id="result" class="result"></div></section></main><script>
const API="https://afia-market-api.onrender.com",states=["جديد","تم التأكيد","جاري التجهيز","خرج للتوصيل","تم التسليم"];
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);$("orderId").value=q.get("id")||"";try{let x=JSON.parse(localStorage.getItem("afiaLastOrder")||"null");if(x){if(!$("orderId").value)$("orderId").value=x.id||"";$("phone").value=x.phone||""}}catch(e){}
function fmt(d){try{return new Date(d).toLocaleString("ar-SA")}catch(e){return""}}
let autoTimer=null,lastStatus="";
async function loadTracking(silent=false){
  let id=$("orderId").value.trim(),phone=$("phone").value.trim();
  $("msg").textContent="";
  if(!silent)$("result").innerHTML="";
  if(!id||!phone){$("msg").textContent="اكتب رقم الطلب ورقم الجوال.";return false}
  try{
    let r=await fetch(API+"/api/orders/"+encodeURIComponent(id)+"?phone="+encodeURIComponent(phone),{cache:"no-store"}),d=await r.json();
    if(!r.ok){$("msg").textContent=r.status===404?"رقم الطلب غير موجود.":"تأكد من رقم الجوال.";return false}
    let o=d.order,idx=states.indexOf(o.status);
    $("autoState").innerHTML='<span class="pulse"></span> تحديث تلقائي كل 15 ثانية • آخر تحديث: '+fmt(o.updatedAt||new Date().toISOString());
    $("result").innerHTML='<div class="orderNo">'+o.id+'</div><div style="margin:7px 0"><span class="status">'+o.status+'</span></div><div>العميل: <b>'+o.name+'</b></div><div>الإجمالي: <b>'+Number(o.total||0).toFixed(2)+' ر.س</b></div>'+(o.locationUrl?'<div style="margin-top:8px"><a href="'+o.locationUrl+'" target="_blank">📍 فتح موقع التوصيل</a></div>':'')+'<div class="timeline">'+states.map((s,i)=>'<div class="step '+((i<=idx&&idx>=0)||(o.status==="ملغي"&&i===0)?'done':'')+'"><span class="dot"></span><div><b>'+s+'</b><small>'+((o.statusHistory||[]).find(h=>h.status===s)?.at?fmt((o.statusHistory||[]).find(h=>h.status===s).at):"")+'</small></div></div>').join("")+'</div>'+(o.status==="ملغي"?'<div style="margin-top:14px;color:#b42318;font-weight:900">تم إلغاء الطلب</div>':'')+'<div class="summary"><b>محتويات الطلب</b><div class="items">'+(o.items||[]).map(x=>'<div>'+x.name+' × '+x.qty+'</div>').join("")+'</div></div>';
    if(lastStatus&&lastStatus!==o.status&&"Notification" in window&&Notification.permission==="granted")new Notification("تم تحديث طلبك",{body:o.id+" • "+o.status});
    lastStatus=o.status;
    return true;
  }catch(e){if(!silent)$("msg").textContent="تعذر الاتصال بنظام التتبع. حاول مرة أخرى.";return false}
}
$("trackBtn").onclick=async()=>{let ok=await loadTracking(false);if(ok){if(autoTimer)clearInterval(autoTimer);autoTimer=setInterval(()=>loadTracking(true),15000)}};

if($("orderId").value&&$("phone").value)$("trackBtn").click();
</script></body></html>
