function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?rows.map(function(row){return '<tr>'+row.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td colspan="'+headers.length+'">'+t('noResults')+'</td></tr>')+'</tbody></table></div>'}
function status(s){return '<span class="status '+(s==='draft'?'wait':s==='late'?'danger':'')+'">'+esc(t(s))+'</span>'}
function kpi(){return '<section class="kpis">'+metric(t('orders'),'<span class="numbers">24</span>','🛍','↑ 8%')+metric(t('invoices'),'<span class="numbers">18</span>','🧾','↑ 12%')+metric(t('purchaseOrders'),'<span class="numbers">11</span>','📦','↑ 4%')+metric(t('overdue'),'<span class="numbers">4</span>','⏳',t('sample'))+'</section>'}
function chart(){
var rev=[320,445,510,625,780,980],gain=[75,88,114,169,194,235];
function pts(ar){return ar.map(function(v,i){return (25+i*109)+','+(177-v/1100*148)}).join(' ')}
return '<svg class="pulse" viewBox="0 0 620 200" role="img" aria-label="Sample revenue and profit line chart" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbeaff"/><stop offset="100%" stop-color="#fff"/></linearGradient></defs><path d="M15 177 H606 M15 109 H606 M15 43 H606" fill="none" stroke="#e3ecf7" stroke-dasharray="5 5"/><polygon fill="url(#fill)" points="25,177 '+pts(rev)+' 570,177"/><polyline points="'+pts(rev)+'" fill="none" stroke="#1260e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="'+pts(gain)+'" fill="none" stroke="#08ad9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="197" font-size="11" fill="#788ca2">May</text><text x="555" y="197" font-size="11" fill="#788ca2">Oct</text></svg>'
}
function home(){
var recent=[['🧾',tx('فاتورة مبيعات تجريبية SO-2026-024','Sample sales invoice SO-2026-024'),t('posted')],['📦',tx('استلام مخزون تجريبي','Sample goods received'),tx('اليوم','Today')],['💳',tx('تسوية قبض توضيحية','Illustrative payment matching'),tx('أمس','Yesterday')]];
return title(t('hello'),t('subtitle'),'<button class="btn primary" data-go="finance">▦ '+esc(t('finance'))+'</button>')+kpi()+
'<div class="two"><section class="panel"><div class="pflex"><h2>✦ '+t('months')+'</h2><span class="badge-demo">DEMO</span></div><p class="sub">'+t('demoHint')+'</p>'+chart()+'<div class="legend"><span><i class="dot"></i>'+t('revenue')+'</span><span><i class="dot green"></i>'+t('profit')+'</span></div></section><section class="panel"><h2>'+t('activity')+'</h2><p class="sub">'+t('demoHint')+'</p><ul class="activity">'+recent.map(function(a){return '<li><span class="event-icon">'+a[0]+'</span><div><strong>'+a[1]+'</strong><small>'+a[2]+'</small></div></li>'}).join('')+'</ul></section></div>'+
'<div class="pagehead"><div><h1 style="font-size:22px">'+t('applications')+'</h1><p>'+t('demoHint')+'</p></div></div><div class="apps">'+nav.filter(function(x){return !['home','settings'].includes(x[0])}).map(function(x){return '<button class="app" data-go="'+x[0]+'"><span class="big">'+x[1]+'</span><b>'+esc(t(x[0]))+'</b><small>'+t('view')+'</small></button>'}).join('')+'</div>';
}
function finance(){
var stats='<section class="kpis">'+metric(t('assets'),money(2450000),'🏦')+metric(t('liabilities'),money(1120000),'📋')+metric(t('equity'),money(1330000),'🛡')+metric(t('netprofit'),money(235000),'📈')+'</section>';
var tabs=[['balance',t('balance')],['tb',t('tb')],['pnl',t('pnl')],['ledger',t('ledger')]];
var menu='<div class="tabline">'+tabs.map(function(x){return '<button class="btn '+(state.tab===x[0]?'sel':'')+'" data-tab="'+x[0]+'">'+esc(x[1])+'</button>'}).join('')+'</div>';
var content='';
if(state.tab==='balance')content=table([t('account'),t('value')],[[t('assets'),money(2450000)],[t('liabilities'),money(1120000)],[tx('رأس المال','Paid-in capital'),money(1095000)],[t('netprofit'),money(235000)],[t('equity'),money(1330000)]]);
if(state.tab==='tb')content=table([t('number'),t('account'),t('debit'),t('credit')],report.map(function(r){return ['<b>'+r[0]+'</b>',esc(tx(r[1],r[2])),money(r[3]),money(r[4])]}).concat([['','<b>'+tx('الإجمالي','Total')+'</b>','<b>'+money(3195000)+'</b>','<b>'+money(3195000)+'</b>']]));
if(state.tab==='pnl')content=table([t('account'),t('value')],[[t('revenue'),money(980000)],[tx('التكاليف والمصروفات','Costs and expenses'),money(745000)],[t('netprofit'),'<b>'+money(235000)+'</b>']]);
if(state.tab==='ledger')content=table([t('number'),t('account'),t('debit'),t('credit')],report.map(function(r){return [r[0],esc(tx(r[1],r[2])),money(r[3]),money(r[4])]}));
return title(t('financeTitle'),t('financeDesc'),'<button class="btn" id="printReport">🖨 '+t('print')+'</button><button class="btn" id="exportReport">↓ '+t('export')+'</button>')+stats+'<div class="panel">'+menu+'<div class="pflex"><h2>'+tabs.find(function(x){return x[0]===state.tab})[1]+'</h2><span class="status">'+t('balanced')+' · DEMO</span></div><p class="sub">'+t('demoHint')+'</p>'+content+'</div>';
}
function documents(kind){
var isSales=kind==='sales',data=isSales?sales:purchases;var q=state.filter.toLowerCase();
var found=data.filter(function(r){return r.join(' ').toLowerCase().includes(q)});
return title(t(isSales?'salesTitle':'purchaseTitle'),t(isSales?'salesDesc':'purchaseDesc'),'<button class="btn primary" data-demo-action="new">＋ '+esc(t('sample'))+'</button>')+'<section class="mini">'+metric(t(isSales?'orders':'purchaseOrders'),isSales?'24':'11','📑')+metric(t('total'),money(isSales?143350:133500),'💰')+metric(t('draft'),isSales?'1':'1','🕗')+'</section>'+
'<section class="panel"><div class="toolbar"><input class="search" id="filterInput" type="search" autocomplete="off" placeholder="'+esc(t('search'))+'" value="'+esc(state.filter)+'"><span class="badge-demo">DEMO DATA</span></div><div id="dataTable">'+table([t('number'),t(isSales?'customer':'suppliers'),t('date'),t('total'),t('status'),t('details')],found.map(function(r){return ['<b>'+esc(r[0])+'</b>',esc(tx(r[1],r[2])),esc(r[3]),money(r[4]),status(r[5]),'<button class="btn" data-detail="'+esc(r[0])+'">'+t('details')+'</button>']}))+'</div></section>';
}
function inventory(){return title(t('invTitle'),t('invDesc'),'<button class="btn primary" data-demo-action="stock">＋ '+t('actions')+'</button>')+'<section class="mini">'+metric(tx('الأصناف','Items'),'4','📦')+metric(tx('الوحدات','Stock units'),'117','📚')+metric(tx('قيمة تقديرية','Sample stock value'),money(670000),'💰')+'</section><div class="panel">'+table([t('number'),t('account'),tx('الكمية','Quantity'),t('status')],stock.map(function(r){return [esc(r[0]),esc(tx(r[1],r[2])),n(r[3])+' '+r[4],status('posted')]}))+'</div>'}
var sectorMap={hospital:[['rooms','🛏'],['patient','🪪'],['nursing','🩺'],['meals','🍽'],['medicines','💊'],['radiology','🩻'],['labtests','🔬'],['appointments','📅'],['billing','🧾']],clinic:[['appointments','📅'],['patient','🪪'],['doctors','👨‍⚕️'],['queue','⏳'],['prescriptions','📋'],['billing','🧾']],lab:[['labtests','🔬'],['samples','🧫'],['results','📊'],['patient','🪪'],['billing','🧾'],['inventory','📦']],pharmacy:[['drugs','💊'],['prescriptions','📋'],['expiry','📅'],['suppliers','🚚'],['sales','🧾'],['inventory','📦']]};
function healthcare(){
var option=['hospital','clinic','lab','pharmacy'].map(function(key){return '<option value="'+key+'" '+(state.sector===key?'selected':'')+'>'+esc(t(key))+'</option>'}).join('');
var tiles=sectorMap[state.sector].map(function(r){return '<button class="tile" data-med="'+r[0]+'"><span>'+r[1]+'</span><b>'+esc(t(r[0]))+'</b><small>'+t('notready')+'</small></button>'}).join('');
return title(t('medicalTitle'),t('medicalDesc'))+'<section class="panel"><div class="toolbar"><label for="sectorSelect"><b>'+t('choose')+'</b></label><select id="sectorSelect">'+option+'</select><span class="badge-demo">PREVIEW ONLY</span></div><div class="dlist">'+tiles+'</div></section>'+
'<section class="panel" style="margin-top:18px"><h2>'+t('patient')+' · '+t('sample')+'</h2><p class="sub">'+t('demoHint')+'</p>'+table([t('number'),t('customer'),t('date'),t('status')],patients.map(function(r){return [r[0],esc(tx(r[1],r[2])),r[3],status(r[5])]}))+'</section>';
}
function crm(){return title(t('crmTitle'),t('crmDesc'),'<button class="btn primary" data-demo-action="crm">＋ '+t('actions')+'</button>')+
'<section class="mini">'+metric(tx('الفرص','Opportunities'),'12','◎')+metric(tx('قيد التفاوض','Negotiations'),'5','🤝')+metric(tx('متابعة اليوم','Follow-ups today'),'3','📅')+'</section><section class="panel">'+table([t('number'),t('customer'),t('total'),t('status')],[['CRM-101',tx('شركة النخبة الافتراضية','Demo Elite Co.'),money(85000),status('draft')],['CRM-102',tx('شركة المدى الافتراضية','Demo Horizon Ltd.'),money(60000),status('posted')]])+'</section>'}
function reports(){return title(t('reportsTitle'),t('reportsDesc'))+'<div class="dlist">'+[['tb','📒'],['pnl','📊'],['balance','🏦'],['ledger','📋']].map(function(row){return '<button class="tile" data-report="'+row[0]+'"><span>'+row[1]+'</span><b>'+t(row[0])+'</b><small>'+t('demoHint')+'</small></button>'}).join('')+'</div>'}
function settings(){return title(t('settingTitle'),t('settingDesc'))+'<section class="panel"><h2>'+tx('اللغة','Language')+'</h2><div class="tabline"><button class="btn" data-language="ar">العربية RTL</button><button class="btn" data-language="en">English LTR</button></div><p class="section-caption">'+t('demoHint')+'</p><p class="skeleton">'+t('notready')+'</p></section>'}
function ask(){return '<p>'+t('aiDesc')+'</p><div class="ask"><input id="askInput" type="text" maxlength="100" placeholder="'+t('askPlaceholder')+'"><button class="btn primary" id="askSend">'+t('ask')+'</button></div><div id="askResult"></div>'}
function modal(head,body){el('modalTitle').textContent=head;el('modalBody').innerHTML=body;el('modalClose').textContent=t('close');el('overlay').classList.remove('hidden')}
function close(){el('overlay').classList.add('hidden')}
function page(p){if(!nav.some(function(x){return x[0]===p}))return;state.page=p;state.filter='';if(p!=='finance')state.tab='balance';render();window.scrollTo({top:0,behavior:'auto'})}
function render(){
document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
el('lang').textContent=state.lang==='ar'?'English':'العربية';
el('trialTag').textContent=t('view');el('demoLabel').innerHTML=t('demo');
el('nav').innerHTML='<div class="navheading">'+t('nav')+'</div>'+nav.map(function(v){return '<button type="button" class="navbtn '+(state.page===v[0]?'active':'')+'" data-go="'+v[0]+'" '+(state.page===v[0]?'aria-current="page"':'')+'><span>'+v[1]+'</span><span>'+t(v[0])+'</span></button>'}).join('')+'<div class="menu-foot">ONE ERP NEXT<br>'+esc(t('view'))+' · DEMO</div>';
var v=state.page;
el('view').innerHTML=v==='home'?home():v==='finance'?finance():v==='sales'||v==='purchase'?documents(v):v==='inventory'?inventory():v==='medical'?healthcare():v==='crm'?crm():v==='reports'?reports():settings();
}
function exportCSV(){
var headings=['account_code','account_name','debit_SAR','credit_SAR'];
var rows=report.map(function(r){return [r[0],state.lang==='ar'?r[1]:r[2],r[3],r[4]]});
var csv=[headings].concat(rows).map(function(row){return row.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='ONE_ERP_NEXT_DEMO_TRIAL_BALANCE.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
document.addEventListener('click',function(ev){
var btn=ev.target.closest('button');if(!btn)return;
if(btn.id==='lang'||btn.hasAttribute('data-language')){state.lang=btn.getAttribute('data-language')|| (state.lang==='ar'?'en':'ar');render();return}
if(btn.hasAttribute('data-go')){page(btn.getAttribute('data-go'));return}
if(btn.hasAttribute('data-tab')){state.tab=btn.getAttribute('data-tab');render();return}
if(btn.hasAttribute('data-report')){state.tab=btn.getAttribute('data-report');page('finance');return}
if(btn.hasAttribute('data-med')){modal(t(btn.getAttribute('data-med')), '<p>'+t('notready')+'</p>');return}
if(btn.hasAttribute('data-detail')){modal(t('details')+' · '+btn.getAttribute('data-detail'),'<p>'+t('demoHint')+'</p><p>'+t('notready')+'</p>');return}
if(btn.hasAttribute('data-demo-action')){modal(t('sample'),'<p>'+t('demoAction')+'</p><p>'+t('notready')+'</p>');return}
if(btn.id==='settingsTop'){page('settings');return}
if(btn.id==='printReport'){window.print();return}
if(btn.id==='exportReport'){exportCSV();return}
if(btn.id==='askTop'){modal(t('aiTitle'),ask());return}
if(btn.id==='askSend'){var v=el('askInput').value.toLowerCase();var answer;if(v.includes('ربح')||v.includes('profit'))answer=t('netprofit')+': '+money(235000);else if(v.includes('بيع')||v.includes('sales'))answer=t('revenue')+': '+money(980000);else if(v.includes('فاتور')||v.includes('invoice'))answer=t('invoices')+': 18';else answer=t('aiDesc');el('askResult').innerHTML='<p class="skeleton">'+answer+'<br><small>'+t('demoHint')+'</small></p>';return}
if(btn.id==='modalClose'){close();return}
});
document.addEventListener('change',function(ev){if(ev.target.id==='sectorSelect'){state.sector=ev.target.value;render()}});
document.addEventListener('input',function(ev){if(ev.target.id==='filterInput'){state.filter=ev.target.value;var base=state.page==='sales'?sales:purchases;var a=base.filter(function(r){return r.join(' ').toLowerCase().includes(state.filter.toLowerCase())});el('dataTable').innerHTML=table([t('number'),t(state.page==='sales'?'customer':'suppliers'),t('date'),t('total'),t('status'),t('details')],a.map(function(r){return ['<b>'+esc(r[0])+'</b>',esc(tx(r[1],r[2])),esc(r[3]),money(r[4]),status(r[5]),'<button class="btn" data-detail="'+esc(r[0])+'">'+t('details')+'</button>']}))}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')close()});
el('overlay').addEventListener('click',function(ev){if(ev.target===el('overlay'))close()});
render();
})();
</script>
</body></html>
